# SpaceMIT K1 / Bianbu ES8326, opt-in PCM for Microduck.
# Install as /etc/alsa/conf.d/99-microduck-es8326.conf. Do not replace pcm.default
# or the board's working mixer/device-tree setup.
#
# Both directions share an I2S clock. Bare plughw negotiates 16 kHz for the mic
# and 48 kHz for the voice: each works alone, but the second hw_params fails.
# Fix the hardware at the board's working 48 kHz / stereo / S16_LE format and
# let ALSA convert to the SDK's 16 kHz mono input and 48 kHz mono output.
pcm.microduck_es8326 {
    type plug
    slave {
        pcm {
            # Bianbu's PCM only exposes RW_INTERLEAVED. The rate/channel
            # conversion plugins also need an emulated mmap access path.
            type mmap_emul
            slave.pcm "hw:CARD=sndes8326,DEV=0"
        }
        format S16_LE
        rate 48000
        channels 2
    }
    # Duplicate mono playback; average stereo capture instead of summing/clipping.
    route_policy average
    hint {
        show on
        description "Microduck ES8326 (hardware 48 kHz stereo, SDK format conversion)"
    }
}

ctl.microduck_es8326 {
    type hw
    card sndes8326
}
